name: infa-basic

# Docker's json-file logs are read by the collector's filelog receiver.
# Unrotated they grow until the disk fills, so every service caps them.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# This project owns the `shared-infra` network. App repos join it with:
#   networks:
#     shared-infra:
#       external: true
#
# `observability` is a second, private network. VictoriaMetrics, VictoriaLogs
# and the socket proxy live only there: the stores are unauthenticated and the
# proxy's container-inspect response carries every service's environment
# variables. Apps see exactly one observability endpoint, `otel-collector:4318`.
networks:
  default:
    name: shared-infra
  observability:
    name: observability
  # Owned by the separate `monitoring` compose project. Grafana joins it to
  # reach the Prometheus that still feeds the node/nginx/blackbox/docker-stats
  # dashboards — signals the OTel collector does not yet produce.
  monitoring:
    name: monitoring
    external: true

volumes:
  pgdata:
  redisdata:
  miniodata:
  vmdata:
  vlogsdata:
  otelstate:

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: postgres
      PETAG_DB_PASSWORD: ${PETAG_DB_PASSWORD:?set in .env}
      PHOTOBOXTYB_DB_PASSWORD: ${PHOTOBOXTYB_DB_PASSWORD:?set in .env}
      POSTYB_DB_PASSWORD: ${POSTYB_DB_PASSWORD:?set in .env}
      OSVYN_DB_PASSWORD: ${OSVYN_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
      PETAG_REDIS_PASSWORD: ${PETAG_REDIS_PASSWORD:?set in .env}
      PHOTOBOXTYB_REDIS_PASSWORD: ${PHOTOBOXTYB_REDIS_PASSWORD:?set in .env}
      POSTYB_REDIS_PASSWORD: ${POSTYB_REDIS_PASSWORD:?set in .env}
      OSVYN_REDIS_PASSWORD: ${OSVYN_REDIS_PASSWORD:?set in .env}
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["redis-server", "/etc/redis/redis.conf"]
    volumes:
      - redisdata:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      - ./redis/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: docker.io/minio/minio
    restart: unless-stopped
    logging: *logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
      # Without this the metrics endpoint demands a JWT. Safe here: MinIO
      # publishes only on 127.0.0.1 and is otherwise reachable only from
      # shared-infra.
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  minio-provisioner:
    image: docker.io/minio/mc
    restart: "no"
    logging: *logging
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      PETAG_MINIO_ACCESS_KEY: ${PETAG_MINIO_ACCESS_KEY:?set in .env}
      PETAG_MINIO_SECRET_KEY: ${PETAG_MINIO_SECRET_KEY:?set in .env}
      PHOTOBOXTYB_MINIO_ACCESS_KEY: ${PHOTOBOXTYB_MINIO_ACCESS_KEY:?set in .env}
      PHOTOBOXTYB_MINIO_SECRET_KEY: ${PHOTOBOXTYB_MINIO_SECRET_KEY:?set in .env}
      POSTYB_MINIO_ACCESS_KEY: ${POSTYB_MINIO_ACCESS_KEY:?set in .env}
      POSTYB_MINIO_SECRET_KEY: ${POSTYB_MINIO_SECRET_KEY:?set in .env}
      OSVYN_MINIO_ACCESS_KEY: ${OSVYN_MINIO_ACCESS_KEY:?set in .env}
      OSVYN_MINIO_SECRET_KEY: ${OSVYN_MINIO_SECRET_KEY:?set in .env}
    entrypoint: ["/bin/sh", "/provision.sh"]
    volumes:
      - ./minio/provision.sh:/provision.sh:ro

  backup:
    build: ./backup
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      BACKUP_APPS: ${BACKUP_APPS:-petag photoboxtyb postyb osvyn}
      POSTGRES_HOST: ${BACKUP_POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${BACKUP_POSTGRES_PORT:-5432}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${BACKUP_REDIS_HOST:-redis}
      REDIS_PORT: ${BACKUP_REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: ${BACKUP_MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups:/backups

  victoriametrics:
    image: docker.io/victoriametrics/victoria-metrics:latest
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    networks: [observability]
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=${METRICS_RETENTION:-30d}"
      - "-httpListenAddr=:8428"
    volumes:
      - vmdata:/victoria-metrics-data
    ports:
      - "127.0.0.1:8428:8428"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  victorialogs:
    image: docker.io/victoriametrics/victoria-logs:latest
    restart: unless-stopped
    logging: *logging
    mem_limit: 384m
    networks: [observability]
    command:
      - "-storageDataPath=/victoria-logs-data"
      - "-retentionPeriod=${LOGS_RETENTION:-14d}"
      - "-retention.maxDiskSpaceUsageBytes=${LOGS_MAX_DISK:-10GB}"
      - "-httpListenAddr=:9428"
    volumes:
      - vlogsdata:/victoria-logs-data
    ports:
      - "127.0.0.1:9428:9428"
    # No healthcheck: the victoria-logs image is distroless — no /bin/sh and no
    # wget for one to exec, so it could only ever report unhealthy. (The
    # victoria-metrics image above does ship wget, so it keeps its healthcheck.)
    # The smoke test asserts /health instead.

  # Holds the Docker socket so the collector never does: a :ro socket mount
  # makes only the file read-only, not the API behind it, which would let a
  # compromised collector create privileged containers and escape to the host.
  docker-socket-proxy:
    image: docker.io/tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    networks: [observability]
    environment:
      CONTAINERS: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    logging: *logging
    mem_limit: 300m
    # The image defaults to UID 10001, which can neither read
    # /var/lib/docker/containers (0700 root) nor write the root-owned
    # otelstate volume. Root inside the container; every mount except the
    # state volume stays read-only.
    user: "0"
    # Bridges both networks: apps push OTLP over shared-infra; the backends
    # and the socket proxy are reachable only over observability.
    networks: [default, observability]
    depends_on:
      - victoriametrics
      - victorialogs
      - docker-socket-proxy
    environment:
      METRICS_REMOTE_WRITE_URL: ${METRICS_REMOTE_WRITE_URL}
      LOGS_OTLP_ENDPOINT: ${LOGS_OTLP_ENDPOINT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OTEL_PG_PASSWORD: ${OTEL_PG_PASSWORD}
      # resourcedetection's `system` detector runs inside this container, so it
      # reports the collector's container id as host.name. The `env` detector
      # runs first, so this overrides it with the real host.
      OTEL_RESOURCE_ATTRIBUTES: host.name=${OTEL_HOST_NAME:-infra-vps}
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otelstate:/var/lib/otelcol
      - /:/hostfs:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    # No published port and no healthcheck: the image is built from scratch,
    # with no shell or wget for a healthcheck to exec. Liveness is asserted by
    # the smoke test against :13133 instead.

  grafana:
    image: docker.io/grafana/grafana:latest
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    # default for postgres and the plugin download; observability for the
    # backends; monitoring for the legacy Prometheus datasource.
    networks: [default, observability, monitoring]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_DATABASE_SSL_MODE: disable
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
    # No volume: all state lives in the `grafana` PostgreSQL database, which
    # backup.sh dumps. Plugin installation needs outbound internet on first start.
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
