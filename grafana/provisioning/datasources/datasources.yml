# Grafana provisioning: datasources only.
#
# No dashboard provider is configured here, deliberately. Dashboards are
# authored by hand in the Grafana UI, so they must stay editable and must
# never be overwritten by a provisioner on restart.
apiVersion: 1

datasources:
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    jsonData:
      timeInterval: 30s

  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428

  # The pre-existing Prometheus from the `monitoring` compose project. It is
  # the only source of blackbox (probe_*), nginx (nginx_*), node-exporter
  # (node_*) and docker-stats (dockerstats_*) metrics — the OTel collector
  # produces none of those — so the dashboards migrated from the old Grafana
  # query it. uid is pinned because those dashboards reference it by uid.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 15s
